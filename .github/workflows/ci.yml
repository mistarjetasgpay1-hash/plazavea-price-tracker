name: Tests

on:
  push:
    branches: [main]
    paths: ['tracker/**', 'tests/**', 'config.yaml', 'requirements*.txt', 'pyproject.toml']
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install --quiet --disable-pip-version-check -r requirements-dev.txt
      - run: python -m pytest -q
