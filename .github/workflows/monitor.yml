name: Monitor Plaza Vea (pruebas)

# Producción: los bots corren 24/7 en el VPS (ecosystem.config.js).
# Este workflow ya NO está programado; solo se usa para:
#   · push a main  → prueba de integración real (simulación, no envía a Telegram)
#   · ejecución manual → simulación o, si el VPS está caído, una corrida real puntual
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'config*.yaml'
      - 'run_*.py'
      - 'requirements.txt'
      - '.github/workflows/monitor.yml'
  workflow_dispatch:
    inputs:
      bot:
        description: 'Bot a ejecutar'
        type: choice
        options: [ambos, alimentos, general]
        default: ambos
      dry_run:
        description: 'Simulación (no envía a Telegram). Desmárcalo solo si el VPS está caído: este historial no se comparte con el VPS.'
        type: boolean
        default: true

concurrency:
  group: monitor-plazavea-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: write   # solo se usa en corridas reales manuales (historial en ramas state-*)

jobs:
  monitor:
    name: ${{ matrix.bot }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        bot: ${{ fromJSON(inputs.bot == 'alimentos' && '["alimentos"]' || inputs.bot == 'general' && '["general"]' || '["alimentos","general"]') }}
    env:
      DRY_RUN: ${{ github.event_name == 'push' || inputs.dry_run }}
      STATE_FILE: state/plazavea_${{ matrix.bot }}.json
      STATE_BRANCH: state-${{ matrix.bot }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: pip install --quiet --disable-pip-version-check -r requirements.txt

      - name: Restaurar historial (solo corrida real)
        if: env.DRY_RUN != 'true'
        run: |
          mkdir -p state
          if git fetch --quiet --depth=1 origin "$STATE_BRANCH" 2>/dev/null; then
            git show "FETCH_HEAD:$(basename "$STATE_FILE")" > "$STATE_FILE" 2>/dev/null || rm -f "$STATE_FILE"
          elif git fetch --quiet --depth=1 origin state 2>/dev/null; then
            git show FETCH_HEAD:plazavea.json > "$STATE_FILE" 2>/dev/null || rm -f "$STATE_FILE"
          fi
          if [ -f "$STATE_FILE" ]; then echo "Historial restaurado"; else echo "Sin historial previo"; fi

      - name: Ejecutar bot ${{ matrix.bot }}
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}      # bot general
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TELEGRAM_TOKEN3: ${{ secrets.TELEGRAM_TOKEN3 }}    # bot canasta básica (run_alimentos)
          CHAT_ID3: ${{ secrets.CHAT_ID3 }}
        run: python run_${{ matrix.bot }}.py

      - name: Guardar historial (solo corrida real)
        if: always() && env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f "$STATE_FILE" ] || { echo "Nada que guardar"; exit 0; }
          name=$(basename "$STATE_FILE")
          tmp=$(mktemp -d)
          cp "$STATE_FILE" "$tmp/$name"
          cd "$tmp"
          git init --quiet --initial-branch="$STATE_BRANCH"
          git add "$name"
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit --quiet -m "state: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push --quiet --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$STATE_BRANCH"
