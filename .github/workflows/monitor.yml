name: Monitor Plaza Vea

# Producción: los bots corren SOLO en GitHub Actions (sin VPS).
#   · schedule (cron)  → corrida REAL: envía a Telegram y guarda el historial en ramas state-*
#   · ejecución manual → REAL por defecto (marca "Simulación" si solo quieres probar)
#   · push a main      → prueba de integración en SIMULACIÓN (no envía a Telegram)
on:
  schedule:
    # Horas en UTC (Lima = UTC-5). Minutos desfasados del :00 para evitar la cola pico de GitHub.
    - cron: '7,22,37,52 0-5,11-23 * * *'   # 06:00–00:59 Lima → cada 15 min
    - cron: '7 6-10 * * *'                 # 01:00–05:59 Lima → cada hora
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'config*.yaml'
      - 'run_*.py'
      - 'requirements.txt'
      - '.github/workflows/monitor.yml'
  workflow_dispatch:
    inputs:
      bot:
        description: 'Bot a ejecutar'
        type: choice
        options: [ambos, alimentos, general]
        default: ambos
      dry_run:
        description: 'Simulación (no envía a Telegram ni guarda el historial)'
        type: boolean
        default: false

# Las corridas reales nunca se cancelan entre sí (comparten el historial en las ramas state-*):
# se encolan. Las simulaciones de push sí se cancelan si llega un push más nuevo.
concurrency:
  group: monitor-plazavea-${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run)) && 'simulacion' || 'real' }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: write   # guarda el historial de las corridas reales en las ramas state-*

jobs:
  monitor:
    name: ${{ matrix.bot }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        bot: ${{ fromJSON(inputs.bot == 'alimentos' && '["alimentos"]' || inputs.bot == 'general' && '["general"]' || '["alimentos","general"]') }}
    env:
      # 'true' solo en push o si marcas "Simulación" al lanzarlo a mano; en el cron siempre 'false'.
      DRY_RUN: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
      STATE_FILE: state/plazavea_${{ matrix.bot }}.json
      STATE_BRANCH: state-${{ matrix.bot }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: pip install --quiet --disable-pip-version-check -r requirements.txt

      - name: Restaurar historial (solo corrida real)
        if: env.DRY_RUN != 'true'
        run: |
          mkdir -p state
          if git fetch --quiet --depth=1 origin "$STATE_BRANCH" 2>/dev/null; then
            git show "FETCH_HEAD:$(basename "$STATE_FILE")" > "$STATE_FILE" 2>/dev/null || rm -f "$STATE_FILE"
          elif git fetch --quiet --depth=1 origin state 2>/dev/null; then
            git show FETCH_HEAD:plazavea.json > "$STATE_FILE" 2>/dev/null || rm -f "$STATE_FILE"
          fi
          if [ -f "$STATE_FILE" ]; then echo "Historial restaurado"; else echo "Sin historial previo"; fi

      - name: Ejecutar bot ${{ matrix.bot }}
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}      # bot general (run_general)
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TELEGRAM_TOKEN3: ${{ secrets.TELEGRAM_TOKEN3 }}    # bot canasta básica (run_alimentos)
          CHAT_ID3: ${{ secrets.CHAT_ID3 }}
          BOT: ${{ matrix.bot }}
          EVENTO: ${{ github.event_name }}
        run: |
          echo "── Diagnóstico ──────────────────────────────────────────"
          echo "Evento: $EVENTO · Bot: $BOT · DRY_RUN=$DRY_RUN"
          if [ "$BOT" = "alimentos" ]; then usadas="TELEGRAM_TOKEN3 CHAT_ID3"; else usadas="TELEGRAM_TOKEN CHAT_ID"; fi
          for nombre in $usadas; do
            valor="${!nombre}"
            if [ -n "$valor" ]; then echo "Secreto $nombre: definido (${#valor} caracteres)"
            elif [ "$DRY_RUN" = "true" ]; then echo "::warning title=Secreto vacío::$nombre está vacío (en simulación no se usa)"
            else echo "::error title=Secreto vacío::$nombre no llega al job: revisa Settings → Secrets and variables → Actions"; fi
          done
          if [ "$DRY_RUN" = "true" ]; then
            echo "::notice title=Simulación ($BOT)::DRY_RUN=true por evento '$EVENTO': no se envía nada a Telegram."
          fi
          echo "─────────────────────────────────────────────────────────"
          python run_${BOT}.py

      - name: Guardar historial (solo corrida real)
        if: always() && env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f "$STATE_FILE" ] || { echo "Nada que guardar"; exit 0; }
          name=$(basename "$STATE_FILE")
          tmp=$(mktemp -d)
          cp "$STATE_FILE" "$tmp/$name"
          cd "$tmp"
          git init --quiet --initial-branch="$STATE_BRANCH"
          git add "$name"
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit --quiet -m "state: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push --quiet --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$STATE_BRANCH"
