name: Monitor de Ofertas Plaza Vea

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: monitor-plazavea
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitorear:
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar dependencia ligera
        run: pip install --quiet requests

      - name: Ejecutar bot de ofertas
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python3 -u bot_ofertas.py

      - name: Guardar estado si hubo cambios
        if: always()
        run: |
          if [ -f notificados.json ]; then
            git add notificados.json
            if ! git diff --cached --quiet; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git commit -m "chore: actualizar ofertas notificadas [skip ci]"
              
              for i in 1 2 3; do
                git pull --rebase origin main && git push && break
                echo "Fallo temporal de GitHub en intento $i. Reintentando en 5s..."
                sleep 5
              done
            else
              echo "No hay cambios en notificados.json. Se omite el commit."
            fi
          fi
