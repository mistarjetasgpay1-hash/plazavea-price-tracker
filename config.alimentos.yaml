# ─────────────────────────────────────────────────────────────────────────────
#  Bot Plaza Vea · CANASTA BÁSICA y ASEO  →  python run_alimentos.py --loop 300
#    · Alimentos/abarrotes (arroz, azúcar, aceites, atún, fideos, lácteos, desayuno): desde −15 %
#    · Aseo y limpieza (detergentes, lejía, suavizante, shampoo, toallas higiénicas…): desde −20 %
#  Detecta precio con Tarjeta Oh!, combos (paga X lleva Y, 2x1, 3x2, 2da al %) y precio por kg/L.
#  Bot de Telegram propio: secretos TELEGRAM_TOKEN3 y CHAT_ID3.
#  Hereda el resto de config.yaml.
# ─────────────────────────────────────────────────────────────────────────────
extends: config.yaml

store:
  label: Canasta básica

telegram:
  token_env: TELEGRAM_TOKEN3        # bot dedicado (sin respaldo: nunca escribe en el chat de otro bot)
  chat_id_env: CHAT_ID3

offers:
  min_discount_pct: 15              # umbral por defecto; cada categoría fija el suyo abajo
  # Fuera los dulces de Halloween: por nombre y por las colecciones de campaña de la tienda
  # ("plazaVea | Halloween | 19.10 al 25.10", "Especial Halloween", "Hallowen"…).
  exclude_keywords: [halloween, hallowen]
  exclude_tags: ["hallowe{1,2}n"]

state:
  path: state/plazavea_alimentos.json

scraper:
  # Paginado adaptativo (50 productos por página, ordenados por mayor descuento online):
  fixed_pages: 20                   # sigue leyendo mientras haya ofertas que califiquen…
  tail_pages: 2                     # …y se detiene tras 2 páginas seguidas sin ninguna
  rotating_pages: 2                 # + 2 páginas profundas por corrida, para combos y precios con tarjeta
  max_pages: 48                     #   que aparecen dispersos (la API llega hasta ~2500 productos)
  sweep_deep: true                  # recorre todo el fondo en ciclo, aunque una página venga vacía
  combo_lookups_per_run: 40         # consultas al catálogo para describir el producto "Y" de los combos
  categories:
    # ── Canasta básica · alimentos (mín. 15 %) ──
    - {key: Abarrotes,        path: category-1/abarrotes,                min_discount: 15, group: Abarrotes}
    - {key: LacteosHuevos,    path: category-1/lacteos-y-huevos,         min_discount: 15, group: LacteosHuevos}
    - {key: Desayunos,        path: category-1/desayunos,                min_discount: 15, group: Desayunos}
    # ── Aseo y limpieza (mín. 20 %) ──
    - {key: Limpieza,         path: category-1/limpieza,                 min_discount: 20, group: Limpieza}
    - {key: CuidadoPersonal,  path: category-1/cuidado-personal-y-salud, min_discount: 20, group: CuidadoPersonal}
    - {key: PanalesToallitas, path: category-1/bebe-e-infantil/category-2/panales-y-toallitas-para-bebe, min_discount: 20, group: BebeAseo, sellers: [plazavea]}
    - {key: AseoBebe,         path: category-1/bebe-e-infantil/category-2/cuidado-y-aseo-del-bebe,       min_discount: 20, group: BebeAseo, sellers: [plazavea]}
