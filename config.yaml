# ─────────────────────────────────────────────────────────────────────────────
#  Plaza Vea — configuración COMÚN de los dos bots
#    · config.alimentos.yaml → run_alimentos.py (canasta básica + aseo y limpieza · bot propio)
#    · config.general.yaml   → run_general.py   (tecnología, moda, juguetes, electro, frescos…)
#  Ambos heredan de este archivo (`extends`); lo que definan ahí tiene prioridad.
#  Este archivo no se ejecuta solo.
# ─────────────────────────────────────────────────────────────────────────────
store:
  id: plazavea
  name: Plaza Vea
  hashtag_prefix: PlazaVea          # → #PlazaVea_Abarrotes, #PlazaVea_Moda…

telegram:
  token_env: TELEGRAM_TOKEN         # variable de entorno (.env en el VPS / Secret en GitHub)
  chat_id_env: CHAT_ID
  min_interval_s: 3.2               # pausa entre mensajes (límite Telegram: ~20/min por grupo)
  max_individual_alerts: 15         # alertas con foto por corrida (mayor descuento primero)
  digest_max_items: 200             # el excedente va en resúmenes por grupo (hasta 30 ofertas por mensaje)
  send_photos: true
  health_alert_after_failures: 3    # avisa si 3 corridas seguidas no obtienen datos
  # Grupo → emoji del mensaje y, opcional, thread_id si conviertes el chat en grupo con Temas.
  groups:
    Abarrotes:       {emoji: "🛒", thread_id: null}
    LacteosHuevos:   {emoji: "🥛", thread_id: null}
    Desayunos:       {emoji: "☕", thread_id: null}
    BebeAseo:        {emoji: "🧷", thread_id: null}
    Frescos:         {emoji: "🥩", thread_id: null}
    Bebidas:         {emoji: "🥤", thread_id: null}
    Limpieza:        {emoji: "🧽", thread_id: null}
    CuidadoPersonal: {emoji: "🧴", thread_id: null}
    BebeInfantil:    {emoji: "🍼", thread_id: null}
    Mascotas:        {emoji: "🐾", thread_id: null}
    Tecnologia:      {emoji: "💻", thread_id: null}
    Electro:         {emoji: "🔌", thread_id: null}
    Juguetes:        {emoji: "🧸", thread_id: null}
    Moda:            {emoji: "👕", thread_id: null}
    Deportes:        {emoji: "⚽", thread_id: null}
    Belleza:         {emoji: "💄", thread_id: null}
    Hogar:           {emoji: "🛋️", thread_id: null}
    Libreria:        {emoji: "📚", thread_id: null}
    Automotriz:      {emoji: "🚗", thread_id: null}

offers:
  min_discount_pct: 49.5            # umbral global (cada categoría puede tener min_discount propio)
  min_price: 1.0                    # ignora productos de menos de S/ 1
  exclude_keywords: []              # ej. ["muestra", "pack x 24"]

state:
  # path: lo define cada bot (historiales separados)
  ttl_days: 3                       # un producto avisado se ignora 3 días…
  renotify_drop_pct: 3              # …salvo que su precio baje ≥3 % más: entonces avisa de inmediato
  # Si el historial del bot no existe, se migra desde estas fuentes (sin perder lo ya avisado):
  legacy_paths: [state/plazavea.json, notificados.json]

http:
  timeout_s: 15
  retries: 3
  backoff_base_s: 2
  delay_min_s: 0.5                  # pausa aleatoria entre peticiones a la tienda
  delay_max_s: 1.2

scraper:
  api_url: https://www.plazavea.com.pe/api/io/_v/api/intelligent-search/product_search
  site_url: https://www.plazavea.com.pe
  page_size: 50
  # Faceta "Vendido por" (filtro en servidor) → sellerId VTEX aceptado (validación en cliente).
  sellers:
    plazavea: "1"
    oechsle: oechsle
