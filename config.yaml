# ─────────────────────────────────────────────────────────────────────────────
#  Monitor de ofertas Plaza Vea — configuración
#  Cambia umbrales o categorías aquí; no hace falta tocar el código.
# ─────────────────────────────────────────────────────────────────────────────
store:
  id: plazavea
  name: Plaza Vea
  hashtag_prefix: PlazaVea          # → #PlazaVea_Alimentos, #PlazaVea_Limpieza…

telegram:
  token_env: TELEGRAM_TOKEN         # nombre del secret con el token del bot
  chat_id_env: CHAT_ID              # nombre del secret con el chat destino
  min_interval_s: 3.2               # pausa entre mensajes (límite Telegram: ~20/min por grupo)
  max_individual_alerts: 15         # alertas con foto por corrida (mayor descuento primero)
  digest_max_items: 25              # el excedente se envía en UN mensaje resumen
  send_photos: true
  health_alert_after_failures: 3    # avisa si 3 corridas seguidas no obtienen datos
  # Grupo → emoji del mensaje y, opcional, thread_id si conviertes el chat en grupo con Temas.
  groups:
    Alimentos:       {emoji: "🛒", thread_id: null}
    Bebidas:         {emoji: "🥤", thread_id: null}
    Limpieza:        {emoji: "🧽", thread_id: null}
    CuidadoPersonal: {emoji: "🧴", thread_id: null}
    BebeInfantil:    {emoji: "🍼", thread_id: null}
    Mascotas:        {emoji: "🐾", thread_id: null}
    Tecnologia:      {emoji: "💻", thread_id: null}
    Electro:         {emoji: "🔌", thread_id: null}
    Juguetes:        {emoji: "🧸", thread_id: null}
    Moda:            {emoji: "👕", thread_id: null}
    Deportes:        {emoji: "⚽", thread_id: null}
    Belleza:         {emoji: "💄", thread_id: null}
    Hogar:           {emoji: "🛋️", thread_id: null}
    Libreria:        {emoji: "📚", thread_id: null}
    Automotriz:      {emoji: "🚗", thread_id: null}

offers:
  min_discount_pct: 49.5            # umbral global (cada categoría puede tener min_discount propio)
  min_price: 1.0                    # ignora productos de menos de S/ 1
  exclude_keywords: []              # ej. ["muestra", "pack x 24"]

state:
  path: state/plazavea.json         # vive en la rama `state`, no en main
  ttl_days: 3                       # cada producto puede volver a avisarse a los 3 días
  renotify_drop_pct: 3              # …o antes, si su precio baja ≥3 % desde el último aviso
  legacy_path: notificados.json     # se migra una sola vez (formato antiguo)

http:
  timeout_s: 15
  retries: 3
  backoff_base_s: 2
  delay_min_s: 0.6                  # pausa aleatoria entre peticiones a la tienda
  delay_max_s: 1.4

scraper:
  api_url: https://www.plazavea.com.pe/api/io/_v/api/intelligent-search/product_search
  site_url: https://www.plazavea.com.pe
  page_size: 50
  max_pages: 4                      # por categoría (50 productos c/u); se detiene antes si el descuento
                                    # cae bajo el umbral, así que más páginas solo cuestan si hay ofertas
  # Faceta "Vendido por" (filtro en servidor) → sellerId VTEX aceptado (validación en cliente).
  sellers:
    plazavea: "1"
    oechsle: oechsle
  # path = departamento VTEX · group = grupo de alerta/hashtag
  # Opcionales por categoría: sellers (restringe vendedores) · min_discount (umbral) · max_pages
  categories:
    # ── Consumo diario ──
    - {key: Abarrotes,       path: category-1/abarrotes,                group: Alimentos}
    - {key: Desayunos,       path: category-1/desayunos,                group: Alimentos}
    - {key: Lacteos,         path: category-1/lacteos-y-huevos,         group: Alimentos}
    - {key: QuesosFiambres,  path: category-1/quesos-y-fiambres,        group: Alimentos}
    - {key: Carnes,          path: category-1/carnes-aves-y-pescados,   group: Alimentos}
    - {key: FrutasVerduras,  path: category-1/frutas-y-verduras,        group: Alimentos}
    - {key: Congelados,      path: category-1/congelados,               group: Alimentos}
    - {key: Panaderia,       path: category-1/panaderia-y-pasteleria,   group: Alimentos}
    - {key: Bebidas,         path: category-1/bebidas,                  group: Bebidas}
    - {key: Licores,         path: category-1/vinos-licores-y-cervezas, group: Bebidas}
    - {key: Limpieza,        path: category-1/limpieza,                 group: Limpieza}
    - {key: CuidadoPersonal, path: category-1/cuidado-personal-y-salud, group: CuidadoPersonal}
    - {key: BebeInfantil,    path: category-1/bebe-e-infantil,          group: BebeInfantil}
    - {key: Mascotas,        path: category-1/mascotas,                 group: Mascotas}
    # ── Tecnología, electro, juguetes, moda y hogar (Plaza Vea + Oechsle) ──
    - {key: Tecnologia,      path: category-1/tecnologia,               group: Tecnologia, max_pages: 6}
    - {key: Electrohogar,    path: category-1/electrohogar,             group: Electro,    max_pages: 6}
    - {key: Juguetes,        path: category-1/juguetes-y-juegos,        group: Juguetes,   max_pages: 8}
    - {key: ModaMujer,       path: category-1/moda-mujer,               group: Moda,       max_pages: 8}
    - {key: ModaHombre,      path: category-1/moda-hombre,              group: Moda,       max_pages: 6}
    - {key: ModaInfantil,    path: category-1/moda-infantil,            group: Moda,       max_pages: 6}
    - {key: Accesorios,      path: category-1/accesorios,               group: Moda,       max_pages: 6}
    - {key: Zapatillas,      path: category-1/zapatillas,               group: Moda}
    - {key: Zapatos,         path: category-1/zapatos,                  group: Moda}
    - {key: Deportes,        path: category-1/deportes,                 group: Deportes}
    - {key: Belleza,         path: category-1/belleza,                  group: Belleza}
    - {key: Decohogar,       path: category-1/decohogar,                group: Hogar,      max_pages: 6}
    - {key: Dormitorio,      path: category-1/dormitorio,               group: Hogar,      max_pages: 6}
    - {key: Muebles,         path: category-1/muebles,                  group: Hogar}
    - {key: Terraza,         path: category-1/terraza-y-aire-libre,     group: Hogar}
    - {key: MejoramientoHogar, path: category-1/mejoramiento-del-hogar, group: Hogar}
    - {key: Libreria,        path: category-1/libreria-y-oficina,       group: Libreria}
    - {key: Automotriz,      path: category-1/automotriz,               group: Automotriz}
